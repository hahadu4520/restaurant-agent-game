<style>
:root{--cream:#fff8ec;--ink:#222b3d;--sub:#625b55;--blue:#2b6cff;--red:#ff6b5b;--wood:#c98b57;--line:#ddc8ad;--card:#fffbf3;--shadow:0 7px 26px #5e341a22;font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--ink)}
*{box-sizing:border-box} body{margin:0;min-height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 47% 35%,#fffaf1 0%,#fff1dc 64%,#ebc9a7 125%)}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #ed8d31;outline-offset:3px}button:disabled{opacity:.55;cursor:default}[hidden]{display:none!important}
#stage,#labels{position:absolute;inset:0;overflow:hidden}#stage canvas{display:block;touch-action:none;cursor:grab}#stage canvas:active{cursor:grabbing}#labels{pointer-events:none;z-index:1}
.top{position:absolute;z-index:3;top:clamp(12px,2.5vh,34px);left:clamp(16px,3.3vw,64px);right:clamp(16px,3.3vw,64px);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.brand{display:grid;min-width:0;justify-items:start;gap:8px}h1{margin:0;font-size:clamp(25px,3.75vw,73px);letter-spacing:-.07em;line-height:1.1;font-weight:950;color:#1b2942;text-shadow:0 2px #fff8ed}
.tag{display:inline-flex;align-items:center;gap:.5em;background:#e1e9ff;color:#20489e;border-radius:99px;padding:.34em .8em;font-weight:900;font-size:clamp(13px,1.2vw,24px);line-height:1.1}.tag:before{content:'';background:#2b6cff;border-radius:50%;width:.43em;height:.43em}.tag.open{color:#176b45;background:#d9f0dc}.tag.open:before{background:#2d9964}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;pointer-events:auto}.btn{border:1px solid var(--line);border-radius:12px;background:#fffaf2;min-height:42px;padding:.59em .88em;font-weight:900;box-shadow:0 2px 0 #d8bd9c;line-height:1.15;font-size:clamp(14px,1.13vw,23px)}.btn.primary{background:var(--blue);color:white;border-color:#2356dc;box-shadow:0 3px 0 #1949b7}.btn:hover:not(:disabled),.choice:hover:not(:disabled){filter:brightness(.96)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.station,.tablepin,.bubble{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:900}.station{pointer-events:auto;display:flex;align-items:center;gap:.42em;background:#f3eee9;color:#504d55;border:2px solid #fff9ed;border-radius:99px;padding:.36em .65em;font-size:clamp(14px,1.2vw,24px);box-shadow:0 3px 0 #6c493333,var(--shadow)}.station:after{content:'';position:absolute;left:50%;top:100%;height:13px;width:2px;background:#fff8ed;box-shadow:1px 0 #5a465175}.station i{display:inline-block;width:.52em;height:.52em;border-radius:50%;background:#9a9396}.station.done i{background:#ffc44b;box-shadow:0 0 8px #ffa820}.station.active{color:white;background:#2b6cff}.station.active i{background:#fff5d7}.tablepin{pointer-events:auto;border:1px solid white;background:#fff9eb;border-radius:10px;padding:.33em .52em;font-size:clamp(13px,1vw,20px);box-shadow:var(--shadow)}.tablepin.target{background:#2b6cff;color:white}.tablepin.busy:not(.target){color:#875829}.tablepin .patience{display:block;height:3px;border-radius:3px;margin-top:3px;background:linear-gradient(90deg,#30ac6b calc(var(--time)*100%),#dcd5c8 0)}.tablepin .patience.urgent{background:linear-gradient(90deg,#ef7756 calc(var(--time)*100%),#e2d7cb 0)}.bubble{background:#fff;border:1px solid var(--line);padding:.36em .7em;border-radius:12px;box-shadow:var(--shadow);font-size:clamp(14px,1.5vw,29px)}.bubble.star{color:#a95b00;background:#fff3c8}
.bottom{position:absolute;z-index:2;bottom:clamp(10px,2.5vh,30px);left:clamp(16px,3.3vw,64px);right:clamp(16px,3.3vw,64px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.card{pointer-events:auto;background:#fffbf4f7;border:1px solid #cea77f;border-radius:clamp(13px,1.45vw,28px);box-shadow:var(--shadow);padding:clamp(12px,1.25vw,25px)}
#playbar{width:min(100%,760px)}.card-head{font-size:clamp(18px,1.45vw,29px);font-weight:950;line-height:1.2}.smallline{color:var(--sub);font-size:clamp(13px,1.15vw,22px);font-weight:700;margin:.3em 0 0}.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bar-row .btn{margin-left:auto}.metrics{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:900}.metric strong{color:#205ddd;font-size:1.3em}.game-hints{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.game-hints .btn{font-size:clamp(13px,1vw,18px);min-height:37px}
.modal{position:absolute;z-index:6;inset:0;display:grid;place-items:center;padding:14px;background:#2e274545;backdrop-filter:blur(3px)}.modal.spectate{align-items:end;background:#2e27451a;backdrop-filter:none;padding-bottom:clamp(18px,5vh,65px)}.dialog{width:min(100%,660px);max-height:min(88dvh,850px);overflow:auto;overscroll-behavior:contain;padding:clamp(17px,2.3vw,38px);position:relative}.dialog.teach{width:min(100%,1120px)}.dialog h2{margin:0 38px .35em 0;font-size:clamp(24px,2.55vw,52px);font-weight:950;letter-spacing:-.05em;line-height:1.14}.dialog p{margin:.4em 0 .9em;line-height:1.48;font-size:clamp(15px,1.25vw,24px)}.dialog .close{position:absolute;top:12px;right:12px;min-width:38px;height:38px;border-radius:50%;font-weight:950;background:#f4e6d4}.dialog .feedback{min-height:1.55em;font-weight:900;color:#97513d;margin:.65em 0}.dialog .feedback.good{color:#227247}.dialog .choice{display:block;width:100%;text-align:left;background:#f0e8dc;border:1px solid #ddc9ac;border-radius:10px;padding:.55em .75em;min-height:43px;font-weight:900;margin:7px 0}.choice.selected,.dialog .choice.selected{background:#e2ecff;border-color:#739cff;color:#184aaf}.dialog .choice.correct{background:#e2f3de;color:#235c3a}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips .choice{width:auto;margin:0}.formline{display:flex;gap:8px;flex-wrap:wrap}.formline input{flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white}.timer{float:right;font-size:15px;color:#714725;font-weight:900;margin:2px 41px 0 8px}.teach dl{display:grid;grid-template-columns:max-content 1fr;gap:.32em .8em;margin:.5em 0;font-size:clamp(14px,1.42vw,29px);line-height:1.26}.teach dt{font-weight:950;color:#215ed9}.teach dd{margin:0}.teach blockquote{margin:.65em 0 0;padding:.55em .75em;background:#e6eeff;border-radius:12px;color:#194b9f;font-size:clamp(15px,1.7vw,32px);font-weight:950}.board{width:100%;border-collapse:collapse;text-align:left}.board td,.board th{padding:.48em .25em;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.board .me{color:#1959cc;font-weight:950}.board td:nth-child(2){max-width:9em}.fail{position:absolute;inset:30% 15% auto;text-align:center;font-size:22px;line-height:1.5}.summary{background:#e5edff;padding:.55em .7em;border-radius:10px;font-weight:900}
.command-btn{white-space:nowrap;font-size:clamp(15px,1.35vw,26px)}
.command-heading{font-size:clamp(20px,1.7vw,34px);line-height:1.15;font-weight:950;margin:.34em 0 .24em}
.command-hint{margin:.22em 0;color:#504946;font-weight:750;font-size:clamp(13px,1.08vw,21px)}
#ops-info{color:#2156a6;margin-top:.45em;font-weight:900}

.tablepin.candidate{border:2px solid #729af7;color:#184aa9;background:#f1f5ff}

.station-compare{display:grid;grid-template-columns:max-content 1fr;gap:10px 12px;padding:.72em;background:#f1eadc;border-radius:12px;font-size:clamp(15px,1.16vw,23px);line-height:1.42}
.station-compare dt{font-weight:950;color:#224daa}.station-compare dd{margin:0}
.service-pin{border-color:#d1ba96}.service-pin.attention:not(.target){background:#fff0cb;border-color:#d89743;color:#734809}.kitchen-note{font-size:clamp(12px,1.08vw,20px);background:#e7efff;color:#214b9f}.bubble.you{background:#234fbd;color:#fff;border-color:#fff5d8;font-size:clamp(11px,1vw,18px)}
@media(max-width:680px){.command-heading{font-size:18px}}
@media(max-width:680px){.top{gap:6px}.actions{max-width:48%;gap:5px}.actions .btn{min-height:34px;padding:6px 8px;font-size:12px}.brand{gap:5px}.bottom{left:9px;right:9px;bottom:max(8px,env(safe-area-inset-bottom));gap:6px}.card-head{font-size:17px}.station{font-size:11px;padding:3px 5px;border-width:1px}.station:after{height:7px}.tablepin{font-size:11px}.smallline{line-height:1.35}.dialog{max-height:89dvh}.game-hints{gap:5px}.game-hints .btn{min-height:34px;padding:5px 7px}}
@media(max-height:510px) and (min-width:681px){h1{font-size:30px}.top{top:8px}.bottom{bottom:8px}.card{padding:9px 13px}.card-head{font-size:17px}.station{font-size:13px}.dialog{padding:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.identity-form .btn{justify-self:start}
#restaurant-title{overflow-wrap:anywhere}
</style>

<body>
<div id="stage" aria-label="三维餐厅地图"></div><div id="labels"></div>
<header class="top">
  <div class="brand"><h1 id="restaurant-title">我的餐厅</h1><div id="mode" class="tag">自由探索</div></div>
  <nav class="actions" aria-label="游戏菜单"><button id="player" class="btn">设置昵称</button><button id="rank" class="btn">排行榜</button></nav>
</header>
<div class="bottom">
  <section id="playbar" class="card" aria-live="polite"></section>
</div>
<div id="modal" class="modal" hidden><section id="dialog" class="card dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>

<script>
/* 现场断网：提前下载 0.159.0 的 three.min.js，放在此 HTML 旁边。
   将 LOCAL_THREE 改为 './three.min.js'。留空时优先尝试本地同名文件，再依次尝试 CDN。
   普通打开方式为直接双击。 */
const LOCAL_THREE = '';
const THREE_URLS = LOCAL_THREE ? [LOCAL_THREE] : [
  './three.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.159.0/three.min.js',
  'https://cdn.staticfile.org/three.js/0.159.0/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js'
];
async function loadThree(){
  for(const url of THREE_URLS){
    const loaded = await new Promise(resolve=>{
      const script=document.createElement('script');
      const finish=ok=>{clearTimeout(timeout);script.onload=script.onerror=null;if(!ok)script.remove();resolve(ok)};
      const timeout=setTimeout(()=>finish(false),5000);
      script.onload=()=>finish(Boolean(window.THREE));script.onerror=()=>finish(false);
      script.src=url;document.head.append(script);
    });
    if(loaded)return;
  }
  throw new Error('Three.js 加载失败');
}
function createRestaurant(stage){
  const T=window.THREE, scene=new T.Scene(), fixed=new T.Group();
  scene.add(fixed);
  const mobile=matchMedia('(pointer:coarse)').matches;
  const renderer=new T.WebGLRenderer({alpha:true,antialias:!mobile,powerPreference:'high-performance'});
  renderer.outputColorSpace=T.SRGBColorSpace;
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.16;
  stage.append(renderer.domElement);
  const camera=new T.OrthographicCamera(-15,15,9,-9,.1,120);
  const ambient=new T.HemisphereLight(0xfff9eb,0xc49d83,1.63);
  const sun=new T.DirectionalLight(0xffe4c2,2.26);
  sun.position.set(-12,17,8);
  const fill=new T.DirectionalLight(0xd6e3ff,.7);
  fill.position.set(9,5,-7);
  scene.add(ambient,sun,fill);

  const blue=0x2b6cff, white=0xfff8ec, red=0xff6b5b, wood=0xc98b57;
  const navy=0x1f3967, honey=0xf0bd7b, dark=0x583c34, green=0x629448;
  const materials=new Map(), geometry=new Map(), obstacles=[];
  let parent=fixed, reusable=new T.BoxGeometry(1,1,1);
  function mat(color){
    if(!materials.has(color))materials.set(color,new T.MeshStandardMaterial({color,roughness:.86}));
    return materials.get(color);
  }
  function mesh(g,m,x,y,z,sx=1,sy=1,sz=1){
    const a=new T.Mesh(g,typeof m==='number'?mat(m):m);
    a.position.set(x,y,z);a.scale.set(sx,sy,sz);parent.add(a);return a;
  }
  function block(x,y,z,w,h,d,c){return mesh(reusable,c,x,y,z,w,h,d)}
  function round(x,y,z,w,h,d,r,c){
    r=Math.min(r,w*.42,h*.42,d*.42);
    const key=[w,h,d,r].join();
    if(!geometry.has(key)){
      const s=new T.Shape(), l=w/2-r, t=h/2-r;
      s.moveTo(-l,-t);s.lineTo(l,-t);s.lineTo(l,t);s.lineTo(-l,t);s.closePath();
      const g=new T.ExtrudeGeometry(s,{depth:d-2*r,bevelEnabled:true,bevelSize:r,bevelThickness:r,bevelSegments:1,curveSegments:1,steps:1});
      g.translate(0,0,-(d-2*r)/2);geometry.set(key,g);
    }
    return mesh(geometry.get(key),c,x,y,z);
  }
  // 圆角木台面使用沿水平方向挤出的平面轮廓。
  function slab(x,y,z,w,d,h,r,c){
    const s=new T.Shape(), l=w/2, t=d/2;
    s.moveTo(-l+r,-t);s.lineTo(l-r,-t);s.quadraticCurveTo(l,-t,l,-t+r);
    s.lineTo(l,t-r);s.quadraticCurveTo(l,t,l-r,t);s.lineTo(-l+r,t);
    s.quadraticCurveTo(-l,t,-l,t-r);s.lineTo(-l,-t+r);s.quadraticCurveTo(-l,-t,-l+r,-t);
    const g=new T.ExtrudeGeometry(s,{depth:h,curveSegments:4,bevelEnabled:false});
    g.rotateX(-Math.PI/2);g.translate(0,-h/2,0);
    return mesh(g,c,x,y,z);
  }
  const sphere=new T.SphereGeometry(1,10,6), cylinder=new T.CylinderGeometry(1,1,1,14);
  const cone=new T.CylinderGeometry(.7,1,1,12), circle=new T.CircleGeometry(1,20), morsel=new T.IcosahedronGeometry(1,0);
  function ball(x,y,z,w,h,d,c){return mesh(sphere,c,x,y,z,w,h,d)}
  function tube(x,y,z,w,h,d,c){return mesh(cylinder,c,x,y,z,w,h,d)}
  function tapered(x,y,z,w,h,d,c){return mesh(cone,c,x,y,z,w,h,d)}
  const shadowM=new T.MeshBasicMaterial({color:0x67422d,transparent:true,opacity:.11,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2});
  function shade(x,z,w,d,y=.025){
    const a=mesh(circle,shadowM,x,y,z,w,d,1);a.rotation.x=-Math.PI/2;
  }
  function fence(x,z,w,d,pad=.26){obstacles.push([x-w/2-pad,x+w/2+pad,z-d/2-pad,z+d/2+pad]);}
  function pot(x,z,y=0,s=1,flower=false){
    tapered(x,y+.22*s,z,.31*s,.43*s,.31*s,flower?white:0xc28453);
    tube(x,y+.45*s,z,.32*s,.10*s,.32*s,flower?white:honey);
    for(let j=0;j<5;j++){
      const a=j*2.4, r=(j%2?.18:.25)*s;
      const leaf=ball(x+Math.cos(a)*r,y+(.63+j%3*.13)*s,z+Math.sin(a)*r,.13*s,.29*s,.10*s,j%2?0x7aa74e:green);
      leaf.rotation.z=Math.sin(a)*.65;leaf.rotation.x=Math.cos(a)*.60;
    }
    if(flower){tube(x,y+.78*s,z,.035*s,.60*s,.035*s,green);
      ball(x,y+1.08*s,z,.14*s,.2*s,.13*s,red);
      ball(x+.075*s,y+1.1*s,z,.10*s,.15*s,.12*s,red);
    }
  }
  function tomato(x,y,z,s=1){
    ball(x,y,z,.22*s,.20*s,.22*s,0xe94431);
    tube(x,y+.19*s,z,.10*s,.035*s,.07*s,green);
    tube(x,y+.23*s,z,.035*s,.09*s,.035*s,green);
  }
  function cabinet(x,z,w,d=1.32){
    block(x,.55,z,w,1.05,d,0xb16f42);
    round(x,1.12,z,w+.12,.18,d+.12,.065,honey);
    for(let i=0;i<Math.floor(w/.88);i++){
      const cx=x-w/2+.47+i*.88;
      round(cx,.57,z+d/2+.026,.79,.80,.065,.025,wood);
      block(cx,.79,z+d/2+.082,.24,.055,.055,0xf8c97f);
    }
    shade(x,z,w*.59,d*.73);fence(x,z,w,d);
  }
  function book(x,y,z,closed=false){
    const prior=parent, g=new T.Group();g.position.set(x,y,z);g.rotation.x=closed?.57:.20;prior.add(g);parent=g;
    round(0,.06,0,1.25,.13,.91,.045,closed?red:0xaa5b3c);
    round(-.29,.148,0,.54,.10,.77,.033,white);round(.29,.148,0,.54,.10,.77,.033,0xffedce);
    for(let j=0;j<4;j++){
      block(-.29,.202,-.26+j*.15,.32-j%2*.08,.012,.029,0xcba789);
      block(.30,.202,-.26+j*.15,.32-j%2*.08,.012,.029,0xcba789);
    }
    if(closed){
      tube(.31,.212,-.1,.14,.02,.15,blue);ball(.31,.23,-.1,.11,.035,.10,red);
      for(let i=0;i<3;i++)round(0,.214,-.28+i*.26,.19,.066,.069,.018,0xd6d9d6);
    }
    else for(let j=0;j<3;j++)ball(-.48,.216,-.25+j*.18,.047,.012,.05,blue);
    parent=prior;
  }

  for(let i=0;i<8;i++){
    const soft=new T.MeshBasicMaterial({color:0x986246,transparent:true,opacity:.025+i*.004,depthWrite:false});
    const o=mesh(circle,soft,.40,-1.02+i*.002,.30,14.8-i*.39,10.2-i*.29,1);
    o.rotation.x=-Math.PI/2;
  }
  slab(0,-.72,0,24.5,16.0,.48,1.06,0x986043);
  slab(0,-.42,0,24.8,16.24,.27,1.07,0xb67548);
  slab(0,-.225,0,24.55,16.02,.16,1.03,0xf1b67c);
  slab(0,-.105,0,24.36,15.83,.22,.98,wood);
  const planks=[0xc38853,0xcb915e,0xd59b67,0xce935d,0xd19a62,0xc78c56,0xd5a06f];
  for(let j=0;j<24;j++){
    const z=-7.67+j*.66, limit=Math.abs(z)>7.3?11.58:12.03;
    let left=-limit;
    for(let i=0;left<limit-.02;i++){
      const right=Math.min(limit,left+((i===0)?(1.2+(j%3)*.91):3.9));
      if(right-left>.028)block((left+right)/2,.013,z,right-left-.018,.027,.637,planks[(i*3+j*5)%planks.length]);
      left=right;
    }
  }
  // 开放桌面模型，边缘只用贴地的木收边和盆栽。
  block(0,.07,-7.48,23.62,.12,.16,0xa97553);
  for(const x of [2.4,6.7,10.56])pot(x,-7.02,0,.91,true);
  for(const x of [-11.4,11.38])for(const z of [-1.2,6.65]){pot(x,z,0,.95);fence(x,z,.62,.62);}

  // 左前门廊与点单台。
  const doorX=-9.25, doorZ=6.65;
  shade(doorX,doorZ,1.8,.85);
  for(const offset of [-1.16,1.16]){
    round(doorX+offset,1.30,doorZ,.38,2.58,.53,.11,blue);
    round(doorX+offset,.13,doorZ,.53,.24,.67,.07,white);
    fence(doorX+offset,doorZ,.53,.67);
  }
  round(doorX,2.49,doorZ,2.74,.46,.57,.13,blue);
  for(let i=0;i<7;i++){
    const a=round(doorX-1.10+i*.366,2.32,doorZ+.31,.39,.19,.61,.073,i%2?white:red);
    a.rotation.x=-.28;
  }
  round(doorX,.06,doorZ+.37,1.55,.075,.88,.028,0x5387dd);
  const signBody=round(doorX,2.77,doorZ,1.58,.36,.13,.05,navy);
  const signLamp=round(doorX,2.77,doorZ+.075,1.31,.14,.035,.011,0x89765d);
  for(let i=0;i<4;i++){
    const x=doorX-1.5+i*1.05;
    tube(x,.08,4.48,.16,.12,.16,0xc69c56);
    tube(x,.38,4.48,.048,.66,.048,0xc69c56);ball(x,.73,4.48,.095,.095,.095,honey);
    if(i<3)round(x+.525,.57,4.48,1.04,.074,.09,.028,blue);
  }
  fence(doorX+.075,4.48,3.39,.20);

    const rect=renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({x:((x-rect.left)/rect.width)*2-1,y:1-((y-rect.top)/rect.height)*2},camera);
    const hit=ray.ray.intersectPlane(ground,new T.Vector3());
    if(!hit||Math.abs(hit.x)>12.2||Math.abs(hit.z)>7.9)return null;
    return hit;
  }
  function frame(time,dt){
    frameMean=frameMean*.96+Math.min(dt*1000,65)*.04;
    if(frameMean>25&&++slow>75&&renderer.getPixelRatio()>.8){
      renderer.setPixelRatio(Math.max(.75,renderer.getPixelRatio()*.84));slow=0;frameMean=19;
    }else if(frameMean<23)slow=0;
    const lerp=1-Math.exp(-dt*(reduced?14:3.05));
    for(const k of Object.keys(view))view[k]+=(desired[k]-view[k])*lerp;
    const angle=Math.PI*35/180, radius=32;
    camera.position.set(view.x+Math.sin(view.yaw)*Math.cos(angle)*radius,Math.sin(angle)*radius,view.z+Math.cos(view.yaw)*Math.cos(angle)*radius);
    camera.lookAt(view.x,0,view.z);
    const fit=Math.max(9.45,14.60/aspect)/view.zoom;
    const vertical=aspect<.85?fit*.13:-fit*.014;
    camera.left=-fit*aspect;camera.right=fit*aspect;camera.top=fit-vertical;camera.bottom=-fit-vertical;
    camera.updateProjectionMatrix();camera.updateMatrixWorld();
    actors.forEach(a=>actorTick(a,time,dt));
    [player,...apprentices].forEach((a,i)=>{a.b.position.y=reduced?0:(1+Math.sin(time*3.5+i))*.047});
    steam.forEach((a,i)=>{
      const phase=(time*.72+i/3)%1;
      a.position.set(-4.71+Math.sin(phase*7+i)*.16,1.73+phase*.93,-2.51-i*.07);
      a.scale.set(.08+phase*.08,.13+phase*.09,.085+phase*.06);
    });
    renderer.render(scene,camera);
  }
  function cooking(active){steam.forEach(p=>p.visible=active);}
  function lights(done,open,highlight){
    lamps.forEach((m,i)=>{
      m.color.setHex(i===highlight?0x87b5ff:done[i]?0xffcf63:0x827876);
      m.emissive.setHex(i===highlight?0x2b6cff:done[i]?0xffa82d:0x000000);m.emissiveIntensity=i===highlight?1.25:done[i]?.56:0;
    });

  }
  function reset(){
    pose(player,-2.82,2.63,0,.25);

    [serving,...samples,...tableDishes].forEach(a=>a.visible=false);

  function prop(a,x,y,z){a.visible=true;a.position.set(x,y,z);}
  function stats(){return {triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls,pixelRatio:renderer.getPixelRatio()};}
  reset();
  return {canvas:renderer.domElement,frame,desired,screen,world,move,steer,pose,seatGuest,prop,reset,lights,stats,dishStyle,cooking,
    tables,labelPoints,player,guests,apprentices,serving,samples,tableDishes,pass};
}

function readData(){
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
    if(saved&&Array.isArray(saved.players)){
      const rounds=Array.isArray(saved.rounds)?saved.rounds.filter(r=>r&&typeof r.id==='string'&&
        typeof r.playerId==='string'&&Number.isInteger(r.score)&&r.score>=0):[];
      const players=saved.players.filter(p=>p&&typeof p.name==='string'&&p.name.trim()&&typeof p.id==='string')
        .map(({score,...p})=>{
          const legacyId='legacy:'+p.id;
          if(Number.isFinite(score)&&score>=0&&!rounds.some(r=>r.id===legacyId)){
            rounds.push({id:legacyId,playerId:p.id,score:Math.floor(score),endedAt:null});
          }
          return {...p,done:Number.isInteger(p.done)?p.done&31:0,
            learned:[1,2].includes(p.learned)?p.learned:0,
            qualifying:Number.isInteger(p.qualifying)?Math.max(0,p.qualifying):0};
        });
      return {last:saved.last,players,rounds};
    }
  }catch{}
  return {last:null,players:[],rounds:[]};
}

  const schedule=[[0,2],[12,2],[25,4],[40,1],[54,3],[68,2],[82,2],[95,4],[106,2]];
  const roundLength=120, queuePatience=40;

  function beginRound(){

    resetView();
    round={id:Date.now().toString(36)+'-'+crypto.getRandomValues(new Uint32Array(2)).join('-'),elapsed:0,score:0,served:0,waiting:[],tables:world.tables.map(()=>null),focus:null,selected:null,

  function updateGuestQueue(){
    const positions=[[-8.64,3.81],[-9.38,5.11],[-9.36,6.08]];

  function spawnParty(size,at){
    const inUse=new Set([...round.waiting,...round.tables.filter(Boolean)].map(o=>o.actor));
    const actor=world.guests.find(a=>!inUse.has(a));
    if(!actor||round.waiting.length>=3)return;
    const id=++round.serial;
    const kind=id%4===2?'regular':id%4===3?'unclear':'plain';
    const recipe=current.learned===2&&id%2===1?1:0;
    round.waiting.push({id,size,actor,arrival:at,kind,recipe,confirmed:false,state:'waiting',step:0,until:0,garnished:false});

  function dropParty(i){

  function readyTable(){

    content.append(node('p','command-hint','按顺序点工序。排好后，到工位找工具试做。'));
    const sequence=node('p','summary','还没有选择工序。');

        [...choices.children].forEach(button=>button.disabled=false);

      }
      closePanel(false);startTrial(index);
    },'btn primary');
    submit.disabled=true;
    for(const i of [2,0,3,1]){
      const button=action(recipe.steps[i].name,()=>{

  function activeJob(){

  function jobStep(job){return job&&recipes[job.recipe].steps[job.step];}

  function useTool(id){

    const tool=kitchenTools[id], target=id==='plate'?world.pass.target:tool.target;

    if(step.tool!==id){
      setFeedback('下一步是「'+step.name+'」，去用'+kitchenTools[step.tool].name+'。');
      return;
    }
    if(id==='plate'){plateJob(job);return;}
    if(step.seconds){
      const busy=mode==='round'&&round.tables.some(other=>other!==job&&other?.until&&jobStep(other)?.tool===id);
      if(busy){setFeedback(tool.name+'正在做另一单。');return;}
      job.until=performance.now()+step.seconds*1000;
      setFeedback(step.name+'开始。'+(id==='oven'&&mode==='round'?'烘烤时可以做另一单。':''));

    }

  function plateJob(job){

  function finishTimedStep(job,now){
    if(job.until&&now>=job.until){
      const step=jobStep(job);

  function tickRound(elapsed){
    round.elapsed=elapsed;
    if(elapsed>=roundLength){endRound();return;}
    for(let i=0;i<round.tables.length;i++){
      const p=round.tables[i];if(!p)continue;
      if(p.state==='eating'){
        if(elapsed>=p.leaveAt)dropParty(i);
        continue;
      }
      if(elapsed>=p.deadline){
        dropParty(i);setFeedback((i+1)+' 号桌等太久，客人先走了。');continue;
      }
      finishTimedStep(p,performance.now());
    }
    const front=round.waiting[0];
    const kept=round.waiting.filter(p=>{
      if(elapsed-p.arrival<queuePatience)return true;
      p.actor.g.visible=false;return false;
    });
    if(kept.length!==round.waiting.length){
      round.waiting=kept;updateGuestQueue();
      if(panel==='order'&&front!==kept[0])closePanel();
      setFeedback('一组客人等太久，先离开了。');
    }
    while(round.next<schedule.length&&schedule[round.next][0]<=elapsed){
      const [at,size]=schedule[round.next++];
      if(elapsed-at<queuePatience)spawnParty(size,at);
    }
    const servingIndex=round.selected??readyTable();
    world.serving.visible=servingIndex>=0;
    if(servingIndex>=0){
      const dish=round.tables[servingIndex];
      world.dishStyle(world.serving,dish.recipe,dish.garnished);
    }
    if(round.selected===null&&world.serving.visible){
      world.prop(world.serving,world.pass.x+.42,1.11,world.pass.z);
    }
    if(round.selected!==null){
      const a=world.player.g;
      world.prop(world.serving,a.position.x+Math.sin(a.rotation.y)*1.03,1.03,a.position.z+Math.cos(a.rotation.y)*1.03);
    }
  }
  function playerDistance(target){
    const p=world.player.g.position;
    return Math.hypot(p.x-target[0],p.z-target[1]);
  }
  function tableTarget(i){
    const t=world.tables[i];
    return [t.x,t.z+(t.z<0?1.93:-1.93)];
  }
  function approach(target,place){
    if(playerDistance(target)>serviceRange){
      world.move(...target);setFeedback('前往'+place+'。到旁边后，再点一次或按 E。',5);return false;
    }
    world.player.path.length=0;
    return true;
  }
  function confirmOrder(party){

      '目标 · '+party.size+' 人份'+recipes[party.recipe].name+'。现在去空桌带位。',5);

  function hostOrder(){
    if(mode!=='round'||panel)return;

    if(!party){setFeedback('门口暂时没有客人。');return;}
    if(party.confirmed){setFeedback('订单已确认，请带这组客人去空桌。');return;}
    if(!approach(stations[0].target,'点单台'))return;

    const content=openPanel('order','客人说「随便来点」');

  function seatParty(i){
    const party=round.waiting[0], table=world.tables[i];
    if(!party?.confirmed){setFeedback('先到点单台确认订单。');return;}
    if(round.tables[i]){setFeedback((i+1)+' 号桌有人，找一张空桌。');return;}
    if(party.size>table.capacity){setFeedback(party.size+' 位客人需要四人桌。');return;}
    if(!approach(tableTarget(i),(i+1)+' 号桌'))return;
    round.waiting.shift();updateGuestQueue();
    party.state='prep';party.patience=46;party.deadline=party.seated+party.patience;
    round.tables[i]=party;
    if(round.focus===null||round.tables[round.focus]?.state!=='prep')round.focus=i;
    world.seatGuest(party.actor,tableTarget(i),[table.x-(table.capacity===4?1.25:1.06),table.z]);
    setFeedback('客人已入座。按订单上的菜谱去用厨具。',4);
  }
  function takePlate(){
    if(mode!=='round'||panel)return;
    if(round.selected!==null){setFeedback('手上的菜要送到 '+(round.selected+1)+' 号桌。');return;}
    const i=readyTable();
    if(i<0){useTool('plate');return;}
    if(!approach(world.pass.target,'出餐口'))return;
    round.selected=i;
    setFeedback('已取餐。送到 '+(i+1)+' 号桌。');
  }
  function deliver(i){
    if(round.selected!==i){setFeedback('这盘菜是 '+(round.selected+1)+' 号桌的。');return;}
    if(!approach(tableTarget(i),(i+1)+' 号桌'))return;
    const party=round.tables[i], t=world.tables[i];
    if(party?.state!=='ready')return;
    const points=party.deadline-round.elapsed>=party.patience/2?15:10;
    round.score+=points;round.served++;
    party.state='eating';party.leaveAt=round.elapsed+5.4;round.selected=null;
    world.dishStyle(world.tableDishes[i],party.recipe,party.garnished);
    world.prop(world.tableDishes[i],t.x-.33,1.12,t.z+.16);
    setFeedback('上菜成功！＋'+points+' 分');
  }
  function tableClick(i){
    if(mode!=='round'||panel)return;
    if(round.selected!==null)deliver(i);

    else if(round.tables[i]?.state==='ready')setFeedback('到出餐口取这桌的餐。');

  function interactKitchen(){

    else actions.push([stations[0].target,hostOrder],[world.pass.target,takePlate],
      ...world.tables.map((_,i)=>[tableTarget(i),()=>tableClick(i)]));
    actions.sort((a,b)=>playerDistance(a[0])-playerDistance(b[0]));
    const nearest=actions.find(([target])=>playerDistance(target)<=serviceRange);
    if(nearest)nearest[1]();

      el.setAttribute('aria-label',stations[i].name+(done[i]?'，已点亮':'，未点亮')+(nearest===i?'，可以互动':''));
    });
    tableTags.forEach((el,i)=>{
      if(mode!=='round'){el.hidden=true;return;}
      const t=world.tables[i], p=round.tables[i];
      const status=p?p.state==='eating'?'用餐':p.state==='ready'?'可上菜':p.until?'制作中':'等餐':t.capacity+'位';
      const label=(i+1)+'桌 · '+(p?.state==='prep'?recipes[p.recipe].name:status);
      if(el.firstChild.textContent!==label)el.firstChild.textContent=label;
      const patience=p&&p.state!=='eating'?Math.max(0,(p.deadline-round.elapsed)/p.patience):null;
      el.lastChild.hidden=patience===null;
      if(patience!==null){
        el.lastChild.style.setProperty('--time',patience.toFixed(3));
        el.lastChild.classList.toggle('urgent',patience<.5);
      }
      el.classList.toggle('target',round.selected===i||round.selected===null&&job===p&&Boolean(p));
      el.classList.toggle('candidate',!p&&round.selected===null&&Boolean(round.waiting[0]?.confirmed&&round.waiting[0].size<=t.capacity));
      el.classList.toggle('busy',Boolean(p));
      position(el,[t.x,1.68,t.z],true);
      el.title=p&&p.state!=='eating'?'耐心还剩 '+Math.max(0,Math.ceil(p.deadline-round.elapsed))+' 秒':status;
      el.setAttribute('aria-label',(i+1)+'号桌，'+status+(playerDistance(tableTarget(i))<=serviceRange?'，可以互动':''));
    });
    const operating=mode==='round';
    const front=operating?round.waiting[0]:null;
    const ready=operating?readyTable():-1;
    hostTag.textContent=front?.confirmed?'点单台 · 已接单':'点单台 · 接单';
    passTag.textContent=ready>=0?'出餐口 · '+(ready+1)+' 号桌':'出餐口';
    hostTag.classList.toggle('attention',Boolean(front&&!front.confirmed));
    passTag.classList.toggle('attention',ready>=0);
    hostTag.classList.toggle('target',Boolean(front&&!front.confirmed&&playerDistance(stations[0].target)<=serviceRange));
    passTag.classList.toggle('target',ready>=0&&playerDistance(world.pass.target)<=serviceRange);
    hostTag.setAttribute('aria-label',hostTag.textContent+(playerDistance(stations[0].target)<=serviceRange?'，可以互动':''));
    passTag.setAttribute('aria-label',passTag.textContent+(playerDistance(world.pass.target)<=serviceRange?'，可以互动':''));
    position(hostTag,world.labelPoints[0],operating);
    const canPlate=step?.tool==='plate'&&!job.until;
    const nearPass=playerDistance(world.pass.target)<=serviceRange;
    plateTag.classList.toggle('attention',canPlate);
    plateTag.classList.toggle('target',canPlate&&nearPass);
    plateTag.setAttribute('aria-label','装盘台'+(nearPass?'，可以互动':''));
    plateTag.style.marginTop=ready>=0?'-28px':'';
    position(plateTag,[-2.00,1.84,-2.25],canPlate);
    position(passTag,[world.pass.x+.30,1.87,world.pass.z],operating&&(!canPlate||ready>=0));
    for(const {id,tool,el} of toolTags){
      el.classList.toggle('attention',step?.tool===id&&!job.until);
      const near=playerDistance(tool.target)<=serviceRange;
      el.classList.toggle('target',near&&step?.tool===id&&!job.until);
      el.setAttribute('aria-label',tool.name+(near?'，可以互动':''));
      position(el,tool.label,operating||mode==='trial');
    }
    const baking=mode==='trial'&&trial.until&&step?.tool==='oven'?trial:
      operating?round.tables.find(p=>p?.until&&jobStep(p)?.tool==='oven'):null;
    kitchenTag.textContent=baking?'烘烤 '+Math.max(1,Math.ceil((baking.until-performance.now())/1000))+' 秒':'';
    position(kitchenTag,[-.37,2.55,-6.37],Boolean(baking));
    if(front){
      customerBubble.textContent=front.confirmed&&front.kind==='regular'?'小林 · 不要香菜':
        front.kind==='regular'?'熟客小林 · '+front.size+' 位':front.kind==='unclear'&&!front.confirmed?'想点点好吃的':recipes[front.recipe].name+' · '+front.size+' 位';
      const p=front.actor.g.position;position(customerBubble,[p.x,1.87,p.z+.22],true);
    }else customerBubble.hidden=true;
  }

  playerButton.addEventListener('click',()=>playerPanel());
  rankButton.addEventListener('click',rankPanel);
  playbar.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b)return;
    if(b.dataset.go!==undefined)chooseStation(Number(b.dataset.go));
    if(b.dataset.op==='round')beginRound();
    if(b.dataset.op==='concept')conceptPanel();
    if(b.dataset.op==='rank')rankPanel();
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&panel&&panel!=='save-recipe'&&(panel!=='player'||current)){event.preventDefault();closePanel();}
    if(event.key==='Tab'&&panel){
      const items=[...dialog.querySelectorAll('button:not(:disabled), input:not(:disabled)')];
      if(!items.length)return;
      if(event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items.at(-1).focus();}
      else if(!event.shiftKey&&document.activeElement===items.at(-1)){event.preventDefault();items[0].focus();}
    }
  });
  const pointers=new Map();
  let drag=false,pinch=0;
  const canMove=()=>!panel&&['training','ready','trial','round','result'].includes(mode);
  const moveKeys=new Set(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d']);
  document.addEventListener('keydown',event=>{
    const key=event.key.toLowerCase();
    if(!canMove()||event.altKey||event.ctrlKey||event.metaKey||event.isComposing)return;
    if(moveKeys.has(key)){event.preventDefault();keys.add(key);waypoint=-1;}
    if(key!=='e'||event.repeat)return;
    if(mode==='round'||mode==='trial'){interactKitchen();return;}
    if(mode==='training'||mode==='ready'){
      const nearby=nearbyStation();
      if(nearby>=0)chooseStation(nearby);
      else setFeedback('先走到任意站点旁，再按 E 互动。');
    }
  });
  document.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
  window.addEventListener('blur',()=>keys.clear());
  function zoom(value){world.desired.zoom=Math.max(.77,Math.min(2.02,value));}
  world.canvas.addEventListener('pointerdown',e=>{
    if(!canMove()||e.button>0)return;
    world.canvas.setPointerCapture(e.pointerId);
    if(!pointers.size){drag=false;pinch=0;}
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});
    if(pointers.size>1)drag=true;
  });
  world.canvas.addEventListener('pointermove',e=>{
    const item=pointers.get(e.pointerId);if(!item||!canMove())return;
    const delta=e.clientX-item.x;
    item.x=e.clientX;item.y=e.clientY;
    if(pointers.size>1){
      const [a,b]=pointers.values(), d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch>0&&d>0)zoom(world.desired.zoom*d/pinch);
      pinch=d;return;
    }
    if(Math.hypot(item.x-item.startX,item.y-item.startY)>7)drag=true;
    if(drag)world.desired.yaw-=delta*.008;
  });
  world.canvas.addEventListener('pointerup',e=>{
    if(!pointers.has(e.pointerId))return;
    pointers.delete(e.pointerId);pinch=0;
    if(drag||pointers.size||!canMove())return;
    const hit=world.world(e.clientX,e.clientY);if(!hit)return;
    if(mode==='round'){
      const tabletop=world.world(e.clientX,e.clientY,1.10);
      const i=world.tables.findIndex(t=>tabletop&&Math.hypot(t.x-tabletop.x,t.z-tabletop.z)<1.02);
      if(i>=0){tableClick(i);return;}
      if(tabletop&&Math.hypot(world.pass.x-tabletop.x,world.pass.z-tabletop.z)<1.14){takePlate();return;}
      if(tabletop&&Math.abs(tabletop.x+8.85)<1.95&&Math.abs(tabletop.z-2.76)<.72){hostOrder();return;}
    }
    waypoint=-1;world.move(hit.x,hit.z);
  });
  world.canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=true;pinch=0;});
  world.canvas.addEventListener('wheel',e=>{
    if(!canMove())return;
    e.preventDefault();zoom(world.desired.zoom*Math.exp(-e.deltaY*.0015));
  },{passive:false});

  let lastHud=0,lastStats=0;
  function run(now){
    const wallDelta=Math.max(0,(now-last)/1000),dt=Math.min(.05,wallDelta);last=now;
    if(mode==='training'&&task&&!task.solved){
      const remain=Math.ceil((task.end-now)/1000), clock=byId('task-clock');
      if(remain<=0&&!task.expired){task.expired=true;drawTask();}
      else if(clock&&remain>0)clock.textContent='剩余 '+remain+' 秒';
    }else if(mode==='round')tickRound((now-round.started)/1000);
    else if(mode==='trial')finishTimedStep(trial,now);
    if(canMove()&&keys.size){
      const has=(a,b)=>keys.has(a)||keys.has(b);
      const x=Number(has('d','arrowright'))-Number(has('a','arrowleft'));
      const z=Number(has('s','arrowdown'))-Number(has('w','arrowup'));
      if(x||z)world.steer(x,z,dt);
    }
    world.frame(now/1000,dt);syncWorld();
    if(now-lastHud>85){renderPlay(now);lastHud=now;}
    if(now-lastStats>600){
      const stats=world.stats();document.body.dataset.triangles=stats.triangles;
      document.body.dataset.drawCalls=stats.drawCalls;document.body.dataset.pixelRatio=stats.pixelRatio.toFixed(2);lastStats=now;
    }
    requestAnimationFrame(run);
  }
  resetView();setMode('training');playerPanel();requestAnimationFrame(run);
}

loadThree().then(()=>startGame(createRestaurant(document.getElementById('stage')))).catch(error=>{
  console.error(error);
  const text=document.createElement('p');text.className='fail';
  text.textContent='餐厅的三维画面加载失败。请确认浏览器支持三维加速，联网后刷新，或将 three.min.js 放到网页旁边再打开。';
  document.getElementById('stage').append(text);
  document.querySelector('.bottom').hidden=true;
  document.querySelector('.actions').hidden=true;
});

</script>
